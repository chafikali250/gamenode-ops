name: CI/CD Pipeline - GameNode Ops

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: 1. Checkout du code
        uses: actions/checkout@v4

      - name: 2. Nettoyage préventif de l'espace disque
        run: |
          docker system prune -f --volumes || true
          rm -rf ${{ github.workspace }}/_work/_temp/* || true

      - name: 3. Déploiement avec Ansible (Local)
        run: |
          ansible-playbook -i ansible/inventory.ini ansible/playbook.yml
