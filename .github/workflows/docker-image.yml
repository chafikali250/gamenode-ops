name: CI/CD Pipeline - GameNode Ops

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: 1. Checkout du code
        uses: actions/checkout@v4

      - name: 2. Nettoyage préventif de l'espace disque
        run: |
          docker system prune -f --volumes || true
          rm -rf ${{ github.workspace }}/_work/_temp/* || true

      - name: 3. Connexion à Docker Hub
        uses: docker/login-action@v3
        with:
          username: chali250
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: 4. Configuration de Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 5. Construction et publication de l'image Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: chali250/gamenode:latest

      - name: 6. Déploiement avec Ansible (Local)
        run: |
          ansible-playbook -i ansible/inventory.ini ansible/playbook.yml
