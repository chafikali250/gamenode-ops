- name: Déploiement de GameNode Ops
  hosts: game_servers
  become: yes
  tasks:
    - name: Créer le répertoire de l'application sur le serveur
      file:
        path: /opt/gamenode-ops
        state: directory
        mode: '0755'

    - name: Copier les fichiers de configuration et docker-compose
      copy:
        src: "{{ item }}"
        dest: "/opt/gamenode-ops/{{ item }}"
      loop:
        - docker-compose.yml
        - prometheus.yml

    - name: Mettre à jour l'image Docker et redémarrer le conteneur
      shell: |
        cd /opt/gamenode-ops
        docker compose pull gamenode
        docker compose up -d --no-deps gamenode
